<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#13110e" />
    <meta name="description" content="Things: a quiet shelf of objects, and notes on them." />
    <title>Things</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#shelf">Skip to the shelf</a>
    <header class="masthead"><h1 class="mark" id="mark"><a href="/" data-home>Things</a><span id="count" class="mark-count"></span></h1></header>

    <main id="shelf" class="cabinet" tabindex="-1" aria-label="The shelf" aria-busy="true">
      <noscript><p class="cabinet-note">Things needs JavaScript to lay out the shelf.</p></noscript>
    </main>

    <footer id="credit" class="credit"><p>from <a href="https://wustep.me">Stephen Wu</a></p></footer>

    <div id="detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden></div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
