<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Things: a black-void shelf of products you drop in by URL." />
    <title>Things</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="stage" aria-label="A shelf of things floating in the dark"></canvas>

    <div class="brand" aria-hidden="true">Things<span id="count"></span></div>
    <nav id="sections" class="sections" aria-label="Sections" hidden></nav>

    <section id="empty" class="empty" aria-live="polite">
      <p class="empty-title">Nothing here yet.</p>
      <p id="empty-hint" class="empty-hint" hidden>Paste or drop a product URL to put it on the shelf.</p>
      <pre class="empty-cmd">npm run ingest -- https://example.com/product</pre>
    </section>

    <button id="card" class="card" type="button" aria-live="polite" aria-hidden="true" data-keep-hover>
      <img id="card-thumb" class="card-thumb" alt="" decoding="async" />
      <span class="card-body">
        <span id="card-brand" class="card-brand" hidden></span>
        <span id="card-title" class="card-title"></span>
        <span class="card-foot">
          <span id="card-price" class="card-price" hidden></span>
          <span id="card-domain" class="card-domain"></span>
        </span>
      </span>
      <span class="card-open" aria-hidden="true">&#8599;</span>
    </button>

    <aside id="detail" class="detail" aria-label="Item details" aria-hidden="true">
      <figure class="detail-photos">
        <img id="detail-photo" class="detail-photo" alt="" decoding="async" />
        <button id="detail-photo-prev" class="photo-step photo-step-prev" type="button" aria-label="Previous photo">&#8249;</button>
        <button id="detail-photo-next" class="photo-step photo-step-next" type="button" aria-label="Next photo">&#8250;</button>
        <figcaption id="detail-thumbs" class="detail-thumbs" role="tablist" aria-label="Photos"></figcaption>
      </figure>
      <div class="detail-body">
        <p class="detail-kicker"><span id="detail-section"></span><span id="detail-index"></span></p>
        <p id="detail-brand" class="detail-brand" hidden></p>
        <h2 id="detail-title" class="detail-title"></h2>
        <p class="detail-foot">
          <span id="detail-price" class="detail-price" hidden></span>
          <span id="detail-domain" class="detail-domain"></span>
        </p>
        <p id="detail-desc" class="detail-desc" hidden></p>
        <a id="detail-open" class="detail-open" href="#" target="_blank" rel="noopener noreferrer">Open product page <span aria-hidden="true">&#8599;</span></a>
      </div>
      <nav class="detail-nav" aria-label="Next and previous thing">
        <button id="detail-prev" class="detail-step" type="button"><kbd aria-hidden="true">&larr;</kbd><span id="detail-prev-title" class="detail-step-title"></span></button>
        <button id="detail-next" class="detail-step detail-step-next" type="button"><span id="detail-next-title" class="detail-step-title"></span><kbd aria-hidden="true">&rarr;</kbd></button>
      </nav>
      <button id="detail-close" class="detail-close" type="button" aria-label="Back to the shelf (Esc)">&times;</button>
    </aside>

    <div id="status" class="status" role="status"></div>
    <div id="drop" class="drop" aria-hidden="true"><span>Drop to add</span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
